name: CCSwitcher
options:
  bundleIdPrefix: me.xueshi
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  developmentLanguage: en
  knownRegions:
    - en
    - zh-Hans
    - zh-Hant
    - ja
    - de
    - fr

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: false
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: G9J8D2T6DV
    SWIFT_STRICT_CONCURRENCY: targeted

targets:
  CCSwitcher:
    type: application
    platform: macOS
    sources:
      - path: CCSwitcher
      - path: Shared
    info:
      path: CCSwitcher/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: "CCSwitcher+"
        CFBundleName: "CCSwitcher+"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.nowaylm.ccswitcherplus
            CFBundleURLSchemes:
              - ccswitcher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nowaylm.ccswitcherplus
        CODE_SIGN_ENTITLEMENTS: CCSwitcher/Resources/CCSwitcher.entitlements
        PRODUCT_NAME: CCSwitcherPlus
        MARKETING_VERSION: "1.12.0"
        CURRENT_PROJECT_VERSION: "66"
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    entitlements:
      path: CCSwitcher/Resources/CCSwitcher.entitlements
      properties:
        com.apple.security.application-groups:
          - G9J8D2T6DV.com.nowaylm.ccswitcherplus
    dependencies:
      - target: CCSwitcherWidgetExtension
        embed: true
        codeSign: true

  # Logic-test bundle: no host app, so running the tests never launches
  # CCSwitcher (which would touch the real keychain and the real log file).
  # The sources under test are compiled straight in; `FileLogger.swift` is
  # deliberately absent — CCSwitcherTests/TestFileLog.swift stands in for it.
  CCSwitcherTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CCSwitcherTests
      - path: CCSwitcher/Services/CredentialAnchor.swift
      - path: CCSwitcher/Services/CredentialGate.swift
      - path: CCSwitcher/Services/ClaudeService.swift
      - path: CCSwitcher/Services/KeychainService.swift
      - path: CCSwitcher/Services/L10n.swift
      - path: CCSwitcher/Models/Account.swift
      - path: CCSwitcher/Models/String+Obfuscation.swift
      - path: CCSwitcher/Models/UsageData.swift
      - path: CCSwitcher/Models/AutoSwitchConfig.swift
      - path: CCSwitcher/Services/AutoSwitchEngine.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nowaylm.ccswitcherplus.tests
        PRODUCT_NAME: CCSwitcherTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_STRICT_CONCURRENCY: targeted
        # A logic-test bundle runs out of a temporary directory; signing it
        # would need a Mac Development certificate this machine does not have.
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""

  CCSwitcherWidgetExtension:
    type: extensionkit-extension
    platform: macOS
    sources:
      - path: CCSwitcherWidget
      - path: Shared
    info:
      path: CCSwitcherWidget/Info.plist
      properties:
        CFBundleDisplayName: "CCSwitcher+ Widget"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nowaylm.ccswitcherplus.widget
        CODE_SIGN_ENTITLEMENTS: CCSwitcherWidget/Resources/CCSwitcherWidget.entitlements
        PRODUCT_NAME: CCSwitcherWidgetExtension
        MARKETING_VERSION: "1.12.0"
        CURRENT_PROJECT_VERSION: "66"
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: G9J8D2T6DV
        SWIFT_STRICT_CONCURRENCY: targeted
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
        SKIP_INSTALL: true
    entitlements:
      path: CCSwitcherWidget/Resources/CCSwitcherWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - G9J8D2T6DV.com.nowaylm.ccswitcherplus

schemes:
  CCSwitcherTests:
    build:
      targets:
        CCSwitcherTests: [test]
    test:
      targets:
        - CCSwitcherTests
